server.port=8080

spring.datasource.url=jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2

# JWT
app.jwt.secret=CHANGE_ME_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS
app.jwt.issuer=university-library-api
app.jwt.expirationMinutes=240

# springdoc
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
